<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İzofleks İş Takibi</title>
<meta name="description" content="İzofleks devam eden işler ve haftalık görev takibi.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F4F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1316" media="(prefers-color-scheme: dark)">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İş Takibi">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=3">
<link rel="shortcut icon" type="image/png" href="./icon-192.png?v=3">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>İzofleks İş Takibi</b><span>A42</span></div>
    <div class="tabs" role="tablist">
      <button id="tab-week" role="tab" aria-selected="true" data-act="tab" data-v="week">Hafta</button>
      <button id="tab-jobs" role="tab" aria-selected="false" data-act="tab" data-v="jobs">İşler</button>
    </div>
    <button class="btn install" id="install" hidden data-act="install">Ana ekrana ekle</button>
    <button class="sync" id="sync" data-act="account" title="Hesap / senkron"><span class="dot off"></span><span id="sync-t">başlatılıyor</span></button>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title">Senkron</h3>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="./firebase-config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
